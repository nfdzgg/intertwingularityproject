<!doctype html>
<head>
  <meta charset="utf-8">
  <title>DVD Bounce</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #dvd {
      position: fixed;
      left: 0;
      top: 0;
      width: 150px;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
       pointer-events: auto;
      cursor: pointer;
    }
  </style>
</head>
<body>

<img
     onclick="new Audio('https://raw.githubusercontent.com/nfdzgg/intertwingularityproject/main/	Bingo%20Sound%20Effect.mp3	').play()"
     id="dvd"
     src="https://www.image2url.com/r2/default/images/1793669998770-87762ced-41aa-4990-975a-2a45e37938e6.png"
     alt="">
<script>
(() => {
  const img = document.getElementById('dvd');

  // speed in pixels per frame (lower = slower)
  let vx = 3.2;
  let vy = 3.0;

  // start somewhere not on the border
  let x = 100;
  let y = 100;

  function step() {
    const w = img.getBoundingClientRect().width;
    const h = img.getBoundingClientRect().height;

    const maxX = window.innerWidth - w;
    const maxY = window.innerHeight - h;

    x += vx;
    y += vy;

    // bounce off edges
    if (x <= 0) { x = 0; vx = Math.abs(vx); }
    if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
    if (y <= 0) { y = 0; vy = Math.abs(vy); }
    if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

    img.style.transform = `translate(${x}px, ${y}px)`;

    requestAnimationFrame(step);
  }

  // wait until image has size, then start
  
  if (img.complete) step();
  else img.onload = step;

  // optional: keep it in bounds on resize
  window.addEventListener('resize', () => {
    const w = img.getBoundingClientRect().width;
    const h = img.getBoundingClientRect().height;
    x = Math.min(Math.max(0, x), window.innerWidth - w);
    y = Math.min(Math.max(0, y), window.innerHeight - h);
  });
})();
</script>

</body>
